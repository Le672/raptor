name: Release Windows client
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the packaged Windows download engine
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath release -Filter '*-portable.exe' | Select-Object -First 1
          $data = Join-Path $env:RUNNER_TEMP 'yukino-speed-smoke'
          Start-Process -FilePath $binary.FullName -ArgumentList @('--smoke', "--smoke-data=$data") -WindowStyle Hidden | Out-Null
          $proof = Join-Path $data 'smoke.json'
          $deadline = [DateTime]::UtcNow.AddMinutes(3)
          while (!(Test-Path -LiteralPath $proof) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 1 }
          if (!(Test-Path -LiteralPath $proof)) { throw 'Packaged download check timed out' }
          $result = Get-Content -LiteralPath $proof -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (!$result.packaged -or $result.version -ne $version -or $result.bridgeVersion -ne $version -or $result.result.status -ne 'completed' -or $result.result.bytes -lt 1000000) { throw 'Packaged download check failed' }
          [PSCustomObject]@{version=$result.version;packaged=$result.packaged;source=$result.sourceId;status=$result.result.status;bytes=$result.result.bytes} | ConvertTo-Json
          Copy-Item -LiteralPath $proof -Destination release/smoke.json
      - name: Hash release files
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath release -Filter *.exe | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Yukino-Speed-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/smoke.json
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and package versions do not match' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Yukino Speed $tag" --notes-file RELEASE_NOTES.md }
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $files = @(Get-ChildItem -LiteralPath release -Filter *.exe | Select-Object -ExpandProperty FullName) + @((Resolve-Path release/SHA256SUMS.txt).Path)
          gh release upload $tag $files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
