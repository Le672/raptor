name: Connect VPS Lab domains

on:
  workflow_dispatch:

concurrency:
  group: yukino-lab-domains
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed upstream routing
        run: node --test workers/lab-gateway/worker.test.mjs
      - name: Publish Lab gateway and custom domains
        run: node scripts/deploy-lab-gateway.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
