name: Connect VPS Lab domains

on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Optional RSA public PEM for a private VPS connector
        required: false
        type: string

concurrency:
  group: yukino-lab-domains
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed upstream routing
        run: node --test workers/lab-gateway/worker.test.mjs
      - name: Configure private VPS connectivity
        if: inputs.recipient_public_key != ''
        run: node scripts/configure-lab-connectivity.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAB_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      - name: Publish Lab gateway and custom domains
        run: node scripts/deploy-lab-gateway.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Export encrypted connector handoff
        if: inputs.recipient_public_key != ''
        uses: actions/upload-artifact@v4
        with:
          name: lab-connector-encrypted
          path: .lab-connector/connector.enc.json
          if-no-files-found: error
          retention-days: 1
