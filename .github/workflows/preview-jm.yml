name: Preview independent JM

on:
  push:
    branches: [codex/jm-independent-rebuild]
    paths:
      - 'jm/**'
      - '.github/workflows/preview-jm.yml'
  workflow_dispatch:

concurrency:
  group: preview-jm-independent
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: jm/pnpm-lock.yaml
      - name: Install
        working-directory: jm
        run: pnpm install --frozen-lockfile
      - name: Check Worker
        working-directory: jm/packages/worker
        run: pnpm typecheck
      - name: Build Pages
        working-directory: jm
        run: pnpm web:build
        env:
          VITE_BACKEND_URL: https://jm-api-yukino-preview.3584643854.workers.dev
      - name: Deploy preview API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: jm/packages/worker
          command: deploy --name jm-api-yukino-preview
      - name: Deploy preview Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy jm/packages/page/dist --project-name=jm-yukino --branch=codex-jm-independent
