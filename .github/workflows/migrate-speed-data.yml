name: Export encrypted speed data for VPS migration
on:
  push:
    branches: [master]
    paths:
      - 'vps-content/export-public.pem'
      - 'scripts/export-speed-data.mjs'
      - '.github/workflows/migrate-speed-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export and encrypt only anonymous speed statistics
        run: node scripts/export-speed-data.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
