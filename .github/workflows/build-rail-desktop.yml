name: Build Rail Watch for Windows

on:
  push:
    branches: [master]
    paths:
      - 'electron/rail-*.cjs'
      - 'src/pages/Rail.tsx'
      - 'src/lib/railgo.ts'
      - 'src/lib/train-art.ts'
      - 'src/lib/train-position.ts'
      - 'src/lib/rail-position-data.ts'
      - 'src/lib/rail-gps.ts'
      - 'src/lib/rail-speed.ts'
      - 'src/lib/rail-motion.ts'
      - 'src/hooks/useRailLocation.ts'
      - 'src/types/coordtransform.d.ts'
      - 'src/components/RailMap.tsx'
      - 'src/components/RailSpeed.tsx'
      - 'src/components/TrainIllustration.tsx'
      - 'src/components/RailPosition.tsx'
      - 'src/components/rail-position.css'
      - 'src/data/train-art.json'
      - 'src/assets/trains/**'
      - 'public/rail-third-party-notices.txt'
      - 'src/index.css'
      - 'functions/api/rail.ts'
      - 'rail-electron-builder.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-rail-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node node_modules/electron-builder/out/cli/cli.js --config rail-electron-builder.json --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: Yukino-Rail-Watch-Windows
          path: release-rail/*.exe
          if-no-files-found: error
