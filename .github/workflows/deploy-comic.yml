name: Deploy Comic to Cloudflare
on:
  push:
    branches: [master]
    paths:
      - 'comic/**'
      - 'scripts/*comic*.mjs'
      - 'scripts/check-kv-budget.mjs'
      - '.github/workflows/deploy-comic.yml'
  workflow_dispatch:
concurrency:
  group: deploy-comic-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check shared account KV write budget
        run: npm run kv:budget
      - name: Check catalog, playback proxy and local library
        run: npm run comic:test
      - name: Build the anime theater
        run: npm run comic:build
      - name: Prepare independent cache and playback signing
        run: node scripts/ensure-comic-infra.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy player, API, automatic catalog refresh and domain
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config comic/.deploy/wrangler.json
      - name: Verify production catalog and document routes
        run: node scripts/verify-comic-live.mjs
