name: Lab apps checks
on:
  push:
    branches: [master]
    paths: ['lab-apps/**', '.github/workflows/lab-apps-check.yml']
  pull_request:
    paths: ['lab-apps/**', '.github/workflows/lab-apps-check.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r lab-apps/requirements.lock.txt
      - run: python -m unittest discover -s lab-apps/tests -v
