name: Build JM Desktop for Windows

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-jm-desktop.yml'
      - 'jm/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Install build tools
        run: npm ci
      - name: Install JM dependencies
        run: pnpm --dir jm install --frozen-lockfile
      - name: Build desktop interface
        run: pnpm --dir jm desktop:build
        env:
          VITE_BACKEND_URL: https://jm-api-yukino.3584643854.workers.dev
      - name: Package Windows portable executable
        run: node node_modules/electron-builder/out/cli/cli.js --projectDir jm/desktop --config electron-builder.json --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: Yukino-Comic-Studio-Windows-x64
          path: jm/desktop/release/Yukino-Comic-Studio-1.0.0-portable.exe
          if-no-files-found: error
