<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152d2e"><title>换乘之间 · Metro Atelier</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand hubLink" href="/" aria-label="返回游戏中心" title="返回游戏中心"><span class="mark"><i></i><i></i><i></i></span><strong>换乘之间</strong><small>METRO ATELIER</small></a><nav><button data-nav="studio" class="active">设计台</button><button data-nav="levels">培训与挑战</button><button data-nav="workshop">车站工坊</button></nav><div class="headEnd"><span id="saveState">● 本地存档</span><button id="help" class="iconButton" aria-label="操作指南">?</button></div></header>
<section class="mast"><div><div class="eyebrow"><b class="pulse"></b> STATION DESIGN STUDIO</div><h1 id="name"></h1></div><div class="stationMeta" id="meta"></div><button id="settings" class="outline">车站设置 <span>↗</span></button></section>
<main><section class="drawing"><div class="mapbar"><div class="mapTitle"><b class="cross">⌖</b> 施工视图</div><div class="floorSwitch" id="floors"></div><button class="bare" id="view" title="切换俯视和轴测">俯视</button></div><div id="stage"><canvas id="map" aria-label="可编辑的车站地图" tabindex="0"></canvas><div class="sheetTag"><b id="floorCode">B1</b><div><strong id="floorName">地下一层</strong><small id="layerDetail">站台平面</small></div></div><div class="camera"><button id="minus" title="缩小">−</button><button id="home" title="视图居中">⌖</button><button id="plus" title="放大">＋</button></div><div class="mapStatus" id="mapStatus"></div><div class="compass">↗ <b>N</b></div></div>
<div class="toolbox"><div class="toolhead"><strong>建造工具</strong><div id="groups"></div><div class="history"><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Y">↷</button></div></div><div id="tools"></div><div id="toolOptions"></div></div></section>
<aside><div class="asideTabs" id="asideTabs"><button data-tab="design" class="active">设计</button><button data-tab="traffic">客流</button><button data-tab="replay">回放</button></div><div id="panel"></div><div class="actionBox"><button class="primary" id="run"></button><div id="runNote"></div></div></aside></main>
<footer><span><i class="dot"></i><b id="modeLabel">设计中</b></span><span id="hint">左键布置 · 右键拖动平移 · 滚轮缩放</span><span class="revision">MA / STATION SYSTEM</span></footer>
<dialog id="dialog"><div class="dialogTop"><div><div class="eyebrow" id="dialogCap"></div><h2 id="dialogTitle"></h2></div><button id="close" class="iconButton" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><input type="file" id="file" accept=".json,.metro" hidden>
<script src="station.js"></script><script src="simulation.js"></script><script src="graphics.js"></script><script src="app.js"></script></body></html>
